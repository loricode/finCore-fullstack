# Sirve la SPA y reenvía /api y /health a la API. Así navegador y API comparten origen:
# la cookie del refresh token (SameSite=Strict) funciona sin CORS.
#
# Ojo: un add_header dentro de un location anula TODOS los add_header del server. Por eso las cabeceras
# de seguridad se declaran solo aquí y el caché se controla con "expires", que no las anula.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # HTTP/1.1 hacia Kestrel: con el HTTP/1.0 por defecto, un POST sin cuerpo (p. ej. /auth/refresh)
    # llega sin Content-Length y Kestrel lo rechaza con 400.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # DNS interno de Docker. Con la dirección en una variable, nginx vuelve a resolver "api" cada 10 s:
    # si el contenedor de la API se recrea (nueva IP) no hay que reiniciar nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_read_timeout 60s;
    }

    location /health/ {
        proxy_pass $api_upstream;
    }

    # Archivos con hash en el nombre: caché larga.
    location ~* \.(js|css|woff2?|ico|svg|png)$ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html y rutas de la SPA: sin caché, para tomar siempre la última versión.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
