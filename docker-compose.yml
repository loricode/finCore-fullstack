# FinCore en Docker.
#   docker compose up -d --build                       base + migración + API + web + Worker + Oracle + adaptador Node
#                                                      -> http://localhost:4300
#   docker compose --profile demo run --rm bank-simulator   envía webhooks firmados de prueba al adaptador
#   docker compose --profile test run --rm api-tests   pruebas .NET (unitarias + integración contra la base)
#   docker compose --profile test run --rm db-tests    pruebas T-SQL
#   docker compose --profile test run --rm web-tests   pruebas Angular
#   docker compose --profile test run --rm node-tests  pruebas del adaptador Node
# Los valores por defecto son SOLO de desarrollo; en otros entornos se definen en .env (ver .env.example).

name: fincore

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fincore-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-FinCore_Sa_2026!}
      TZ: UTC
    ports:
      - "${DB_PORT:-14333}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Aplica database/ con deploy.ps1 (incremental: solo lo nuevo o modificado) y crea el login de la aplicación.
  db-migrator:
    build:
      context: .
      dockerfile: infrastructure/docker/db-migrator.Dockerfile
    image: fincore-db-migrator:local
    container_name: fincore-db-migrator
    command:
      - /database/deploy.ps1
      - -Server
      - db
      - -User
      - sa
      - -Password
      - ${MSSQL_SA_PASSWORD:-FinCore_Sa_2026!}
      - -TrustServerCertificate
      - -IncludeDemo
      - -AppLogin
      - ${DB_APP_USER:-fincore_app}
      - -AppPassword
      - ${DB_APP_PASSWORD:-Dev#Api_Segura_2026}
      - -ReportsLogin
      - ${DB_REPORTS_USER:-fincore_reports}
      - -ReportsPassword
      - ${DB_REPORTS_PASSWORD:-Dev#Informes_2026}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: runtime
    image: fincore-api:local
    container_name: fincore-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__FinCore: "Server=db,1433;Database=FinCore;User Id=${DB_APP_USER:-fincore_app};Password=${DB_APP_PASSWORD:-Dev#Api_Segura_2026};Encrypt=True;TrustServerCertificate=True;Application Name=FinCore.Api"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-solo-desarrollo-docker-clave-de-firma-de-32-caracteres}
      Api__ExposeDocs: "true"
      Logging__Json: "true"
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      db-migrator:
        condition: service_completed_successfully
    healthcheck:
      # La imagen aspnet no trae curl: se consulta /health/ready con bash.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \" 200 \" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      target: runtime
    image: fincore-web:local
    container_name: fincore-web
    ports:
      - "${WEB_PORT:-4300}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ Etapa 4 · integraciones

  # Sistema bancario legado simulado. El primer arranque crea el esquema LEGACY_BANK (infrastructure/oracle/init).
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: fincore-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-FinCoreOracle1}
    ports:
      - "${ORACLE_PORT:-1523}:1521"
    volumes:
      - oracledata:/opt/oracle/oradata
      - ./infrastructure/oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Windows Service en Windows; aquí, el mismo binario como proceso de consola.
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: worker
    image: fincore-worker:local
    container_name: fincore-worker
    environment:
      DOTNET_ENVIRONMENT: Docker
      ConnectionStrings__FinCore: "Server=db,1433;Database=FinCore;User Id=${DB_APP_USER:-fincore_app};Password=${DB_APP_PASSWORD:-Dev#Api_Segura_2026};Encrypt=True;TrustServerCertificate=True;Application Name=FinCore.Worker"
      ConnectionStrings__LegacyBank: "User Id=legacy_bank;Password=${LEGACY_BANK_PASSWORD:-Legacy_Bank_2026};Data Source=oracle:1521/FREEPDB1"
      Worker__Jobs__LegacyBankImport__IntervalSeconds: "60"
      Logging__Json: "true"
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      oracle:
        condition: service_healthy
    restart: unless-stopped

  # Adaptador de webhooks: verifica la firma del proveedor, traduce y entrega a la API con reintentos.
  bank-adapter:
    build:
      context: .
      dockerfile: infrastructure/docker/node-adapter.Dockerfile
      target: runtime
    image: fincore-bank-adapter:local
    container_name: fincore-bank-adapter
    environment:
      FINCORE_API_URL: http://api:8080
      FINCORE_SERVICE_USER: svc.integration
      FINCORE_SERVICE_PASSWORD: ${INTEGRATION_PASSWORD:-FinCore*2026}
      BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET:-dev-secreto-webhook}
      DEAD_LETTER_PATH: /app/data/dead-letter.jsonl
    ports:
      - "${ADAPTER_PORT:-5090}:5090"
    volumes:
      - adapterdata:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  bank-simulator:
    profiles: ["demo"]
    image: fincore-bank-adapter:local
    environment:
      ADAPTER_URL: http://bank-adapter:5090
      BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET:-dev-secreto-webhook}
    command: ["node", "scripts/simulate-bank.ts"]
    depends_on:
      bank-adapter:
        condition: service_healthy

  # ------------------------------------------------------------------ pruebas (perfil "test")
  # Las pruebas usan su propia base, FinCore_Tests, recreada desde cero en cada ejecución: las operaciones
  # no se pueden borrar (por diseño), así que probar contra la base de la demo la llenaría de datos de prueba.
  db-test-migrator:
    profiles: ["test"]
    image: fincore-db-migrator:local
    command: ["/database/deploy.ps1", "-Server", "db", "-Database", "FinCore_Tests", "-User", "sa",
              "-Password", "${MSSQL_SA_PASSWORD:-FinCore_Sa_2026!}", "-TrustServerCertificate", "-IncludeDemo", "-Recreate"]
    depends_on:
      db-migrator:
        condition: service_completed_successfully

  api-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: test
    image: fincore-api-tests:local
    environment:
      # sa: las pruebas también consultan y limpian tablas directamente.
      FINCORE_TEST_CONNECTION: "Server=db,1433;Database=FinCore_Tests;User Id=sa;Password=${MSSQL_SA_PASSWORD:-FinCore_Sa_2026!};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      db-test-migrator:
        condition: service_completed_successfully

  db-tests:
    profiles: ["test"]
    image: fincore-db-migrator:local
    command: ["/database/run-tests.ps1", "-Server", "db", "-Database", "FinCore_Tests", "-User", "sa",
              "-Password", "${MSSQL_SA_PASSWORD:-FinCore_Sa_2026!}", "-TrustServerCertificate"]
    depends_on:
      db-test-migrator:
        condition: service_completed_successfully

  web-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      target: test
    image: fincore-web-tests:local

  node-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: infrastructure/docker/node-adapter.Dockerfile
      target: test
    image: fincore-node-tests:local

volumes:
  sqldata:
  oracledata:
  adapterdata:
